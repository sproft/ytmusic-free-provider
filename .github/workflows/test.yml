name: test

on:
  # Called by release.yml so a tag runs the same suite main does, from one
  # definition rather than a copy that can go stale. No inputs and no secrets:
  # everything here is offline or public.
  workflow_call:
  push:
    branches: [main]
  pull_request:
  # Nightly, because several jobs here install upstream unpinned and can only go
  # red once somebody else publishes. models-contract resolves whatever
  # music_assistant_models is current (roughly a release a day), and the docker
  # job builds FROM ghcr.io/music-assistant/server:latest, which moves every day
  # or two. On push and pull_request alone CI only looks when we happen to
  # commit, so the first person to find out that upstream moved is a user on a
  # nightly.
  #
  # 06:23 UTC. Off the hour because jobs scheduled at :00 queue behind everyone
  # else's cron and get delayed, and late enough to clear both upstream release
  # windows (the models bot lands 02:40-03:05, the server prerelease around
  # 04:20). Does not collide with live-extraction.yml at 05:17.
  #
  # Note GitHub disables scheduled workflows after 60 days with no repository
  # activity, so a long quiet spell turns this off silently. Re-enable from the
  # Actions tab.
  schedule:
    - cron: "23 6 * * *"
  # So a drift check can be run on demand rather than waiting for the cron.
  workflow_dispatch:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck -s sh scripts/install_watcher_addon.sh
          shellcheck -s sh tests/test_install_watcher_addon.sh
          shellcheck -s sh scripts/install_provider.sh
          shellcheck -s sh tests/test_install_provider.sh
          # bash syntax: the script uses bash-only features (associative
          # arrays, substring expansion) and runs under the GitHub runner's
          # bash, not under dash.
          shellcheck -s bash .github/scripts/evaluate_build_matrix.sh

      - name: Run installer test suite (POSIX sh, dash)
        run: |
          dash tests/test_install_watcher_addon.sh
          dash tests/test_install_provider.sh
          dash tests/test_watcher_autoupdate.sh

      - name: Run installer test suite (bash, for parity)
        run: |
          bash tests/test_install_watcher_addon.sh
          bash tests/test_install_provider.sh
          bash tests/test_watcher_autoupdate.sh

  busybox:
    # Runs the suite inside Alpine, which uses BusyBox ash + BusyBox utilities
    # (tar, grep, sed, mktemp, head). This is the same userland HAOS ships, so
    # passing here is strong evidence the installer will work on a real HAOS
    # box. We deliberately do NOT install git in the container — the script
    # must rely on curl + tar only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run installer test suite inside alpine (BusyBox ash)
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            alpine:3.20 \
            sh -c 'apk add --no-cache curl ca-certificates jq bash >/dev/null \
                   && echo "shell: $(readlink -f /bin/sh)" \
                   && busybox --help 2>&1 | head -1 \
                   && sh tests/test_install_watcher_addon.sh \
                   && sh tests/test_install_provider.sh \
                   && sh tests/test_watcher_autoupdate.sh'

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 matches the Python version Music Assistant currently ships in
        # its container. 3.11 is the lowest version the model classes have
        # historically supported, so we cover the floor too.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install -r tests/python/requirements.txt

      - name: Run provider unit tests
        run: python -m pytest tests/python -v

  models-contract:
    # The unit suite above replaces music_assistant_models with hand-written
    # stubs, so it can only ever be as correct as those stubs are. This job
    # installs the real package and checks the upstream facts the provider
    # depends on (tests/ma_contract.py). It is the half of that contract the
    # stubbed suite structurally cannot verify.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the real music_assistant_models
        run: |
          pip install pytest music_assistant_models
          pip show music_assistant_models | head -2

      - name: Run model contract tests
        # MA_MODELS_REQUIRED turns a missing package from a skip into a
        # failure, so a broken install cannot pass as a green all-skipped run.
        env:
          MA_MODELS_REQUIRED: "1"
        run: python -m pytest tests/python_integration -v

  docker-lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The beta/nightly legs are advisory: the upstream base image they track
    # can break independently of anything in this repo, and a red advisory
    # job would block release.yml's publish gate (which calls this workflow).
    # Only the latest leg - the one releases build on - is a hard blocker.
    continue-on-error: ${{ matrix.ma_version != 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Test against all moving base-image tags so changes in the
        # container setup of the upstream base image (beta/nightly) are
        # caught early, not only after publishing.
        ma_version: [latest, beta, nightly]
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile (Hadolint)
        if: matrix.ma_version == 'latest'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build (Single-Arch, No Push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true # Loads image into local docker daemon for inspection
          tags: local-test-image:${{ matrix.ma_version }}
          build-args: MA_VERSION=${{ matrix.ma_version }}

      - name: Assert provider files exist in site-packages
        run: |
          # Spin up the built container and verify the provider directory
          # exists in the site-packages path resolved via Python itself.
          # We use --entrypoint sh to override the default "mass" entrypoint.
          docker run --rm --entrypoint sh local-test-image:${{ matrix.ma_version }} -c '
            TARGET_DIR="$( /app/venv/bin/python -c "import sysconfig; print(sysconfig.get_path(\"purelib\"))" )/music_assistant/providers/ytmusic_free"
            echo "Checking path: $TARGET_DIR"
            if [ -d "$TARGET_DIR" ] && [ -f "$TARGET_DIR/manifest.json" ]; then
              echo "Success: Provider files verified in venv."
            else
              echo "Error: Provider files missing from expected site-packages path!" >&2
              exit 1
            fi
          '

      - name: Assert the provider imports against real Music Assistant
        run: |
          # The step above proves the files landed. This one proves they load.
          #
          # ytmusic_free imports five symbols from the music_assistant *server*
          # package at module scope, and nothing else in CI ever executes them:
          # the unit suite replaces music_assistant with a stub, and
          # models-contract installs only music_assistant_models. The server
          # package is not on PyPI (upstream ships it as a release asset), so
          # this image is the only cheap place a real import can happen, and it
          # is the exact environment users run. Issue #66.
          #
          # Piped on stdin rather than mounted so the check needs no volume and
          # no path arithmetic; see tests/verify_server_contract.py for what it
          # asserts and why.
          docker run --rm -i --entrypoint /app/venv/bin/python \
            local-test-image:${{ matrix.ma_version }} - < tests/verify_server_contract.py
